services:
  portfolio:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* is inlined at build time — set the real domain here.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://oussama-ezitouni.com}
    image: oussama-portfolio:latest
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Runtime config for the /api/chat Route Handler.
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    # Start the server, pull the minimal model once (cached in the volume),
    # then keep serving.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 3
        ollama pull ${OLLAMA_MODEL:-qwen2.5:0.5b}
        wait
    volumes:
      - ollama-models:/root/.ollama
    # Not exposed to the host — only the portfolio container talks to it.
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped

volumes:
  ollama-models:
