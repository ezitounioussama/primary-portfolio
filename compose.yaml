services:
  portfolio:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* is inlined at build time — set the real domain here.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://oussama-ezitouni.com}
    image: oussama-portfolio:latest
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
